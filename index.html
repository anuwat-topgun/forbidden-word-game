<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">

  <title>เกมส์คำต้องห้าม</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #word, #countdown {
      font-size: 12vw;
      text-align: center;
    }

    #word { display: none; }

    #rotate {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 24px;
      padding: 20px;
      background: #000;
    }

    button {
      position: absolute;
      bottom: 20px;
      font-size: 18px;
      padding: 10px 20px;
    }

    @media (orientation: portrait) {
      #rotate { display: flex; }
      #container > *:not(#rotate) { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="countdown"></div>
    <div id="word"></div>
    <div id="rotate">กรุณาหมุนหน้าจอเป็นแนวนอน</div>

    <button id="btn" onclick="startGame()">สุ่มคำ</button>
  </div>

  <script>
let words = [
      "กิน","นอน","เดิน","วิ่ง","พูด","คิด","ทำ","ไป","มา","อยู่",
      "ดู","ฟัง","เล่น","ใช้","ให้","เอา","มี","เป็น","รู้","เข้าใจ",
      "รัก","ชอบ","เกลียด","โกรธ","ดีใจ","เสียใจ","กลัว","เขิน","งง","เบื่อ",
      "ข้าว","น้ำ","บ้าน","ห้อง","งาน","เรียน","เงิน","เวลา","เพื่อน","แฟน",
      "มือถือ","เกม","หนัง","เพลง","รถ","ถนน","ร้าน","ตลาด","โรงเรียน","ออฟฟิศ",
      "แบบ","คือ","แล้ว","ก็","เออ","อืม","จริง","ใช่","ไม่","ได้",
      "ใหญ่","เล็ก","ร้อน","เย็น","เร็ว","ช้า","หนัก","เบา","ใหม่","เก่า",

      // 🔥 เพิ่มคำหลุดง่าย (รวมเพิ่มอีก 200 คำ)
      "บน","ล่าง","ซ้าย","ขวา","หน้า","หลัง","ใกล้","ไกล","ก่อน","หลัง",
      "เข้า","ออก","ขึ้น","ลง","เปิด","ปิด","หยิบ","วาง","จับ","ปล่อย",
      "ถาม","ตอบ","บอก","เล่า","คุย","เงียบ","หัวเราะ","ร้อง","ตะโกน","กระซิบ",
      "เห็น","มอง","หา","เจอ","หาย","จำ","ลืม","ลอง","เลือก","เปลี่ยน",
      "เติม","ลด","เพิ่ม","ขาด","เต็ม","ว่าง","พอ","เกิน","ดี","แย่",
      "ง่าย","ยาก","เร็ว","ช้า","แรง","เบา","สั้น","ยาว","กว้าง","แคบ",
      "สูง","ต่ำ","ร้อน","เย็น","หวาน","เค็ม","เปรี้ยว","ขม","เผ็ด","จืด",
      "สะอาด","สกปรก","ใหม่","เก่า","จริง","ปลอม","ถูก","ผิด","ใช่","ไม่",
      "พร้อม","รอ","เริ่ม","หยุด","ต่อ","จบ","ชนะ","แพ้","เสมอ","ลอง",
      "วัน","คืน","เช้า","สาย","บ่าย","เย็น","วันนี้","พรุ่งนี้","เมื่อวาน","ตอนนี้",
      "ทุก","บาง","หลาย","น้อย","มาก","หมด","อีก","เดิม","ใหม่","เดียว",
      "ใคร","อะไร","ที่ไหน","เมื่อไหร่","ทำไม","ยังไง","แบบไหน","เท่าไหร่","กี่","เอง",

      // 🔥 เพิ่มอีก 200 คำใหม่
      "จริงๆ","ประมาณ","เกือบ","นาน","ไว","ทันที","ทีหลัง","ก่อนหน้า","ภายหลัง","ระหว่าง",
      "ข้างใน","ข้างนอก","ตรง","เบี้ยว","เอียง","ตั้ง","ล้ม","ชน","โดน","หลบ",
      "ลองดู","คิดดู","ลองทำ","เอาไป","เอามา","เอาออก","ใส่","ถอด","ปิด","เปิด",
      "นั่ง","ยืน","นอน","หมุน","หัน","เลี้ยว","หยุด","เร่ง","เบรก","ขยับ",
      "ถามอีก","ตอบหน่อย","พูดใหม่","ฟังดู","ดูสิ","ลองนะ","เอาจริง","ไม่เอา","พอแล้ว","อีกที",
      "ตอนแรก","ตอนหลัง","เมื่อกี้","เดี๋ยวนี้","สักพัก","ทันใดนั้น","บ่อย","นานๆ","เสมอ","บางครั้ง",
      "ทั้งหมด","บางส่วน","ส่วนใหญ่","เล็กน้อย","เยอะ","นิดเดียว","พอดี","เกินไป","ขาดไป","ครบ",
      "ด้านหน้า","ด้านหลัง","ด้านบน","ด้านล่าง","ด้านซ้าย","ด้านขวา","ตรงกลาง","รอบๆ","ใกล้ๆ","ไกลๆ",
      "เสียง","ภาพ","สี","กลิ่น","รส","สัมผัส","รู้สึก","นึก","จำได้","ลืมไป",
      "เห็นด้วย","ไม่เห็นด้วย","คิดว่า","น่าจะ","อาจจะ","คงจะ","แน่","ไม่แน่","ชัวร์","ไม่ชัวร์",
      "โอเค","ได้เลย","ไม่เอา","เอา","ใช่ไหม","หรือเปล่า","จริงดิ","โห","อ้าว","เหรอ",
      "แบบนี้","แบบนั้น","แบบโน้น","อย่างนี้","อย่างนั้น","อย่างโน้น","คล้าย","เหมือน","ต่าง","ต่างกัน",
      "เริ่มต้น","สิ้นสุด","ต่อไป","ย้อนกลับ","ไปต่อ","หยุดก่อน","พัก","ลุย","ลองใหม่","เริ่มใหม่",
      "สูงขึ้น","ต่ำลง","ใหญ่ขึ้น","เล็กลง","เร็วขึ้น","ช้าลง","ดีขึ้น","แย่ลง","มากขึ้น","น้อยลง",
      "ชัด","ไม่ชัด","ตรง","ไม่ตรง","พอดี","ไม่พอดี","แน่น","หลวม","แข็ง","นิ่ม",
      "แห้ง","เปียก","สะดวก","ลำบาก","ง่ายมาก","ยากมาก","เร็วมาก","ช้ามาก","ดีมาก","แย่มาก",
      "ใกล้มาก","ไกลมาก","ใหม่มาก","เก่ามาก","ใหญ่","เล็ก","กว้าง","แคบ","ลึก","ตื้น",
      "เปิดไว้","ปิดไว้","เก็บ","ทิ้ง","หยิบขึ้น","วางลง","เอาเข้า","เอาออก","ส่ง","รับ",
      "พูดไป","ฟังไป","ดูไป","คิดไป","ทำไป","ลองไป","เล่นไป","กินไป","นอนไป","เดินไป",
      "รู้สึกดี","รู้สึกแย่","รู้สึกเฉยๆ","น่ารัก","ตลก","แปลก","น่าสนใจ","ธรรมดา","พิเศษ","ธรรมชาติ"
    ];

    function startGame() {
      // ถ้าคำหมดแล้ว รีเซ็ตใหม่
      if (words.length === 0) {
        alert("คำถูกใช้ครบแล้ว! รีเซ็ตใหม่");
        location.reload();
        return;
      }
      const btn = document.getElementById("btn");
      const countdownEl = document.getElementById("countdown");
      const wordEl = document.getElementById("word");

      const index = Math.floor(Math.random() * words.length);
      const randomWord = words[index];

      // ❌ ลบคำที่สุ่มออกไป (กันซ้ำ)
      words.splice(index, 1);

      let count = 5;
      btn.disabled = true;

      wordEl.style.display = "none";
      countdownEl.style.display = "block";
      countdownEl.innerText = count;

      const interval = setInterval(() => {
        count--;

        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(interval);

          countdownEl.style.display = "none";
          wordEl.innerText = randomWord;
          wordEl.style.display = "block";

          btn.disabled = false;
        }
      }, 1000);
    }

    // register service worker (optional but recommended)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
