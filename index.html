<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เกมส์คำต้องห้าม</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #word, #countdown {
      font-size: 12vw;
      text-align: center;
    }

    #word { display: none; }

    #rotate {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 24px;
      padding: 20px;
      background: #000;
    }

    button {
      position: absolute;
      bottom: 20px;
      font-size: 18px;
      padding: 10px 20px;
    }

    /* ❌ ถ้าเป็นแนวตั้ง ให้ซ่อนเกม */
    @media (orientation: portrait) {
      #rotate { display: flex; }
      #container > *:not(#rotate) { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="countdown"></div>
    <div id="word"></div>
    <div id="rotate">กรุณาหมุนหน้าจอเป็นแนวนอน</div>

    <button id="btn" onclick="startGame()">สุ่มคำ</button>
  </div>

  <script>
    const words = [
      "กิน","นอน","เดิน","วิ่ง","พูด","คิด","ทำ","ไป","มา","อยู่",
      "ดู","ฟัง","เล่น","ใช้","ให้","เอา","มี","เป็น","รู้","เข้าใจ",

      "รัก","ชอบ","เกลียด","โกรธ","ดีใจ","เสียใจ","กลัว","เขิน","งง","เบื่อ",

      "ข้าว","น้ำ","บ้าน","ห้อง","งาน","เรียน","เงิน","เวลา","เพื่อน","แฟน",
      "มือถือ","เกม","หนัง","เพลง","รถ","ถนน","ร้าน","ตลาด","โรงเรียน","ออฟฟิศ",

      "แบบ","คือ","แล้ว","ก็","เออ","อืม","จริง","ใช่","ไม่","ได้",
      "เลย","มาก","นิด","หน่อย","ก่อน","หลัง","วันนี้","พรุ่งนี้","เมื่อวาน",

      "ใหญ่","เล็ก","ร้อน","เย็น","เร็ว","ช้า","หนัก","เบา","ใหม่","เก่า",
      "ดี","แย่","ง่าย","ยาก","ใกล้","ไกล","เต็ม","ว่าง"
    ];

    function startGame() {
      const btn = document.getElementById("btn");
      const countdownEl = document.getElementById("countdown");
      const wordEl = document.getElementById("word");

      const randomWord = words[Math.floor(Math.random() * words.length)];

      let count = 5;
      btn.disabled = true;

      wordEl.style.display = "none";
      countdownEl.style.display = "block";
      countdownEl.innerText = count;

      const interval = setInterval(() => {
        count--;

        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(interval);

          countdownEl.style.display = "none";
          wordEl.innerText = randomWord;
          wordEl.style.display = "block";

          btn.disabled = false;
        }
      }, 1000);
    }

    // 📱 พยายามบังคับ fullscreen (บาง browser จะ block ถ้าไม่กด)
    document.body.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  </script>

</body>
</html>
