<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">

  <title>เกมส์</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
    }

    /* ── หน้าเมนู ── */
    #menu {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .menu-logo {
      font-size: 36px;
      margin-bottom: 2px;
    }
    .menu-title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
    }
    .menu-sub {
      font-size: 13px;
      color: #444;
      margin-bottom: 6px;
    }

    .game-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: #161616;
      border: 2px solid #222;
      border-radius: 16px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left;
    }
    .game-card:hover, .game-card:active {
      border-color: #555;
      background: #1e1e1e;
    }
    .game-card-icon {
      font-size: 38px;
      flex-shrink: 0;
    }
    .game-card-body { flex: 1; min-width: 0; }
    .game-card-name {
      font-size: 17px;
      font-weight: bold;
      color: #fff;
    }
    .game-card-desc {
      font-size: 13px;
      color: #555;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-card-arrow {
      font-size: 18px;
      color: #333;
      flex-shrink: 0;
    }

    /* ── หน้าเกมคำต้องห้าม ── */
    #container {
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #word, #countdown {
      font-size: 12vw;
      text-align: center;
    }

    #word { display: none; }

    #rotate {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 24px;
      padding: 20px;
      background: #0d0d0d;
    }

    #btn {
      position: absolute;
      bottom: 20px;
      font-size: 18px;
      padding: 10px 20px;
    }

    #back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 14px;
      padding: 7px 14px;
      background: transparent;
      color: #888;
      border: 1px solid #333;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (orientation: portrait) {
      #rotate { display: flex; }
      #container > *:not(#rotate):not(#back-btn) { display: none !important; }
    }

    #version {
      position: fixed;
      right: 10px;
      bottom: 6px;
      font-size: 11px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- หน้าเมนูหลัก -->
  <div id="menu">
    <div class="menu-logo">🎮</div>
    <div class="menu-title">เลือกเกมส์</div>
    <div class="menu-sub">เล่นได้เลย ไม่ต้องสมัคร</div>

    <button class="game-card" onclick="openGame('forbidden')">
      <div class="game-card-icon">🚫</div>
      <div class="game-card-body">
        <div class="game-card-name">คำต้องห้าม</div>
        <div class="game-card-desc">สุ่มคำแล้วห้ามพูดคำนั้น — เล่นคนเดียวหรือกลุ่ม</div>
      </div>
      <div class="game-card-arrow">›</div>
    </button>

    <button class="game-card" onclick="openGame('werewolf')">
      <div class="game-card-icon">🐺</div>
      <div class="game-card-body">
        <div class="game-card-name">Werewolf</div>
        <div class="game-card-desc">มัลติเพลเยอร์ — 4–12 ผู้เล่น หาตัวมนุษย์หมาป่า</div>
      </div>
      <div class="game-card-arrow">›</div>
    </button>
  </div>

  <!-- หน้าเกมคำต้องห้าม -->
  <div id="container">
    <button id="back-btn" onclick="goHome()">← กลับ</button>
    <div id="countdown"></div>
    <div id="word"></div>
    <div id="rotate">กรุณาหมุนหน้าจอเป็นแนวนอน</div>
    <button id="btn" onclick="startGame()">สุ่มคำ</button>
  </div>

  <div id="version">v1.1.0</div>

  <script>
        let words = [
      "กิน","นอน","เดิน","วิ่ง","พูด","คิด","ทำ","ไป","มา","อยู่",
      "ดู","ฟัง","เล่น","ใช้","ให้","เอา","มี","เป็น","รู้","เข้าใจ",
      "รัก","ชอบ","เกลียด","โกรธ","ดีใจ","เสียใจ","กลัว","เขิน","งง","เบื่อ",
      "ข้าว","น้ำ","บ้าน","ห้อง","งาน","เรียน","เงิน","เวลา","เพื่อน","แฟน",
      "มือถือ","เกม","หนัง","เพลง","รถ","ถนน","ร้าน","ตลาด","โรงเรียน","ออฟฟิศ",
      "แบบ","คือ","แล้ว","ก็","เออ","อืม","จริง","ใช่","ไม่","ได้",
      "ใหญ่","เล็ก","ร้อน","เย็น","เร็ว","ช้า","หนัก","เบา","ใหม่","เก่า",

      // 🔥 เพิ่มคำหลุดง่าย (รวมเพิ่มอีก 200 คำ)
      "บน","ล่าง","ซ้าย","ขวา","หน้า","หลัง","ใกล้","ไกล","ก่อน","หลัง",
      "เข้า","ออก","ขึ้น","ลง","เปิด","ปิด","หยิบ","วาง","จับ","ปล่อย",
      "ถาม","ตอบ","บอก","เล่า","คุย","เงียบ","หัวเราะ","ร้อง","ตะโกน","กระซิบ",
      "เห็น","มอง","หา","เจอ","หาย","จำ","ลืม","ลอง","เลือก","เปลี่ยน",
      "เติม","ลด","เพิ่ม","ขาด","เต็ม","ว่าง","พอ","เกิน","ดี","แย่",
      "ง่าย","ยาก","เร็ว","ช้า","แรง","เบา","สั้น","ยาว","กว้าง","แคบ",
      "สูง","ต่ำ","ร้อน","เย็น","หวาน","เค็ม","เปรี้ยว","ขม","เผ็ด","จืด",
      "สะอาด","สกปรก","ใหม่","เก่า","จริง","ปลอม","ถูก","ผิด","ใช่","ไม่",
      "พร้อม","รอ","เริ่ม","หยุด","ต่อ","จบ","ชนะ","แพ้","เสมอ","ลอง",
      "วัน","คืน","เช้า","สาย","บ่าย","เย็น","วันนี้","พรุ่งนี้","เมื่อวาน","ตอนนี้",
      "ทุก","บาง","หลาย","น้อย","มาก","หมด","อีก","เดิม","ใหม่","เดียว",
      "ใคร","อะไร","ที่ไหน","เมื่อไหร่","ทำไม","ยังไง","แบบไหน","เท่าไหร่","กี่","เอง",

      // 🔥 เพิ่มคำพยางค์เดียว (แทนชุดเดิม)
      "ไฟ","น้ำ","ดิน","ลม","ดาว","เดือน","ฟ้า","ฝน","แดด","หมอก",
      "คน","เด็ก","พ่อ","แม่","พี่","น้อง","ครู","หมอ","แมว","หมา",
      "บ้าน","วัด","นา","สวน","ไร่","ทาง","ซอย","ถ้ำ","ภู","ดอย",
      "รถ","เรือ","บิน","ล้อ","ยาง","ไฟ","แตร","เบรก","แก๊ส","ควัน",
      "มือ","เท้า","ตา","หู","จมูก","ปาก","ฟัน","ผม","คอ","ไหล่",
      "กิน","ดื่ม","นอน","เดิน","วิ่ง","ยืน","นั่ง","ดู","ฟัง","คิด",
      "ดี","เลว","ชั่ว","งาม","สวย","หล่อ","เท่","รวย","จน","จน",
      "ร้อน","เย็น","หนาว","ชื้น","แห้ง","หนัก","เบา","ชัด","มัว","มืด",
      "ไกล","ใกล้","สูง","ต่ำ","กว้าง","แคบ","ลึก","ตื้น","ตรง","คด",
      "รัก","ชัง","โกรธ","กลัว","ยิ้ม","หัว","ร้อง","ขำ","เขิน","งง",
      "เร็ว","ช้า","แรง","เบา","ไว","นาน","ถี่","ห่าง","ครบ","ขาด",
      "วัน","คืน","เช้า","สาย","บ่าย","เย็น","ดึก","วาน","นี้","พรุ่ง",
      "มาก","น้อย","เต็ม","ว่าง","พอ","เกิน","หมด","อีก","เดิม","ใหม่",
      "บน","ล่าง","ซ้าย","ขวา","หน้า","หลัง","ใน","นอก","ข้าง","กลาง",
      "เอา","ให้","มี","เป็น","ใช้","ทำ","ไป","มา","อยู่","ได้"
    ];

    function openGame(game) {
      document.getElementById('menu').style.display = 'none';
      if (game === 'forbidden') {
        document.getElementById('container').style.display = 'flex';
      } else if (game === 'werewolf') {
        location.href = '/werewolf.html';
      }
    }

    function goHome() {
      document.getElementById('container').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
    }

    function startGame() {
      // ถ้าคำหมดแล้ว รีเซ็ตใหม่
      if (words.length === 0) {
        alert("คำถูกใช้ครบแล้ว! รีเซ็ตใหม่");
        location.reload();
        return;
      }
      const btn = document.getElementById("btn");
      const countdownEl = document.getElementById("countdown");
      const wordEl = document.getElementById("word");

      const index = Math.floor(Math.random() * words.length);
      const randomWord = words[index];

      // ❌ ลบคำที่สุ่มออกไป (กันซ้ำ)
      words.splice(index, 1);

      let count = 5;
      btn.disabled = true;

      wordEl.style.display = "none";
      countdownEl.style.display = "block";
      countdownEl.innerText = count;

      const interval = setInterval(() => {
        count--;

        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(interval);

          countdownEl.style.display = "none";
          wordEl.innerText = randomWord;
          wordEl.style.display = "block";

          btn.disabled = false;
        }
      }, 1000);
    }

    // register service worker (optional but recommended)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
